name: Daily 8:00 AM IST Nifty Pre-Market Pulse

on:
  schedule:
    # 02:20 UTC is 07:50 AM IST (Runs Mon-Fri)
    - cron: '20 2 * * 1-5'
  workflow_dispatch: # Allows manual 1-click trigger anytime from GitHub web UI

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Morning Market Scanner
        run: |
          python market_scanner.py

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit Updated Index to Repository Root
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html dist/index.html || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-refresh: Pre-Market Pulse $(date -u)"
            git push origin main || git push origin master || true
          fi
